version: '3.9'

services:
  web:
    build:
      context: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/code
      - ./chroma_data:/code/chroma
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      - DB_NAME=gctu_db
      - DB_USER=gctu_user
      - DB_PASSWORD=gctu_pass
      - DB_HOST=db
      - DB_PORT=5432

  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: gctu_db
      POSTGRES_USER: gctu_user
      POSTGRES_PASSWORD: gctu_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  chroma_data:
