<!-- templates/registration/login.html -->
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Login | Students Chatbot Assistant</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-indigo-700 via-purple-700 to-blue-800 min-h-screen text-gray-800 font-sans">

  <!-- ✅ Reusable Header -->
  {% include 'header.html' %}

  <!-- ✅ Login Form Container -->
  <div class="flex flex-col items-center justify-center min-h-[calc(100vh-4rem)] px-4 py-10">
    <div class="bg-white rounded-xl shadow-xl p-8 w-full max-w-md animate-fade-in">
      <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">Login to Chat</h2>

      <form method="post">
        {% csrf_token %}
        {% if error %}
          <div class="bg-red-100 text-red-700 p-3 rounded mb-4">
            {{ error }}
          </div>
        {% endif %}
      
        <div class="mb-4">
          <label for="username" class="block text-gray-700 mb-2">Username</label>
          <input type="text" name="username" id="username" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" required>
        </div>
      
        <div class="mb-6">
          <label for="password" class="block text-gray-700 mb-2">Password</label>
          <input type="password" name="password" id="password" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" required>
        </div>
      
        <button type="submit" class="w-full bg-indigo-600 text-white py-2 rounded-lg font-semibold hover:bg-indigo-700 transition">Login</button>
      </form>

      <p class="text-sm text-gray-600 mt-6 text-center">
        Don't have an account? 
        <a href="{% url 'register' %}" class="text-indigo-600 hover:underline">Register here</a>
      </p>
    </div>
  </div>

  <!-- Optional fade-in animation -->
  <style>
    .animate-fade-in {
      animation: fadeIn 1s ease-out;
    }

    @keyframes fadeIn {
      0% {
        opacity: 0;
        transform: translateY(20px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>

</body>
</html>
