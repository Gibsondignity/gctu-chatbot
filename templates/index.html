<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Students Chatbot Assistant</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateX(-10px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .animate-fade-in {
      animation: fadeInUp 0.3s ease-out;
    }

    .animate-slide-in {
      animation: slideIn 0.2s ease-out;
    }

    .fade-in {
      animation: fadeInUp 0.4s ease-in-out both;
    }

    /* Custom scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: #f1f1f1;
    }

    ::-webkit-scrollbar-thumb {
      background: #c1c1c1;
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #a8a8a8;
    }
  </style>
</head>
<body class="bg-gray-50 h-screen flex font-sans">

  <!-- Sidebar -->
  <aside class="w-80 bg-white border-r border-gray-200 flex flex-col">
    <!-- Header -->
    <div class="p-4 border-b border-gray-200">
      <h1 class="text-xl font-bold text-gray-800">GCTU Chatbot</h1>
      <button id="new-chat-btn" class="mt-3 w-full bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg transition-colors flex items-center justify-center gap-2">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
        </svg>
        New Chat
      </button>
    </div>

    <!-- Chat History -->
    <div class="flex-1 overflow-y-auto p-2">
      <div id="chat-list" class="space-y-1">
        <!-- Chat items will be populated here -->
      </div>
    </div>
  </aside>

  <!-- Main Chat Area -->
  <main class="flex-1 flex flex-col">
    <!-- Chat Header -->
    <header class="bg-white border-b border-gray-200 px-6 py-4">
      <h2 id="current-chat-title" class="text-lg font-semibold text-gray-800">New Chat</h2>
    </header>

    <!-- Chat Messages -->
    <div class="flex-1 overflow-y-auto p-6" id="chat-messages">
      <!-- Welcome message -->
      <div class="text-center py-12">
        <div class="max-w-md mx-auto">
          <h3 class="text-2xl font-bold text-gray-800 mb-4">Welcome to GCTU Smart Chatbot</h3>
          <p class="text-gray-600">Ask me anything about Ghana Communication Technology University and its IT programs!</p>
        </div>
      </div>
    </div>

    <!-- Input Area -->
    <div class="border-t border-gray-200 p-6">
      <div class="max-w-4xl mx-auto">
        <form id="chat-form" class="flex gap-3">
          {% csrf_token %}
          <input
            id="chat-input"
            type="text"
            placeholder="Type your question..."
            class="flex-1 px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
            required
          />
          <button
            type="submit"
            class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-lg transition-colors flex items-center gap-2"
          >
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path>
            </svg>
            Send
          </button>
        </form>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="text-center text-sm text-gray-500 py-4 bg-white border-t border-gray-200">
    &copy; {{ now|date:"Y" }} Ghana Communication Technology University. All rights reserved.
  </footer>

  <script>
    let currentConversationId = null;
    const chatForm = document.getElementById('chat-form');
    const chatInput = document.getElementById('chat-input');
    const chatMessages = document.getElementById('chat-messages');
    const chatList = document.getElementById('chat-list');
    const newChatBtn = document.getElementById('new-chat-btn');
    const currentChatTitle = document.getElementById('current-chat-title');

    function markdownToHtml(text) {
      // Simple markdown to HTML converter
      return text
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')  // Bold
        .replace(/\*(.*?)\*/g, '<em>$1</em>')  // Italic
        .replace(/^### (.*$)/gim, '<h3>$1</h3>')  // H3
        .replace(/^## (.*$)/gim, '<h2>$1</h2>')  // H2
        .replace(/^# (.*$)/gim, '<h1>$1</h1>')  // H1
        .replace(/^- (.*$)/gim, '<li>$1</li>')  // Bullet points
        .replace(/^\d+\. (.*$)/gim, '<li>$1</li>')  // Numbered lists
        .replace(/\n\n/g, '</p><p>')  // Paragraphs
        .replace(/\n/g, '<br>')  // Line breaks
        .replace(/<p><\/p>/g, '')  // Clean empty paragraphs
        .replace(/^/, '<p>')  // Start with paragraph
        .replace(/$/, '</p>');  // End with paragraph
    }

    function appendMessage(content, sender = 'user') {
      const wrapper = document.createElement('div');
      wrapper.className = `flex mb-4 ${sender === 'user' ? 'justify-end' : 'justify-start'} animate-fade-in`;

      const message = document.createElement('div');
      message.className = `max-w-2xl px-4 py-3 rounded-2xl ${
        sender === 'user'
          ? 'bg-blue-600 text-white rounded-br-md'
          : 'bg-gray-100 text-gray-800 rounded-bl-md'
      }`;
      message.innerHTML = sender === 'user' ? content.replace(/\n/g, '<br>') : markdownToHtml(content);

      wrapper.appendChild(message);
      chatMessages.appendChild(wrapper);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function createNewChat() {
      currentConversationId = null;
      currentChatTitle.textContent = 'New Chat';
      chatMessages.innerHTML = `
        <div class="text-center py-12">
          <div class="max-w-md mx-auto">
            <h3 class="text-2xl font-bold text-gray-800 mb-4">Welcome to GCTU Smart Chatbot</h3>
            <p class="text-gray-600">Ask me anything about Ghana Communication Technology University and its IT programs!</p>
          </div>
        </div>
      `;
      chatInput.focus();
    }

    function addChatToSidebar(title, id) {
      const chatItem = document.createElement('div');
      chatItem.className = 'p-3 rounded-lg hover:bg-gray-100 cursor-pointer transition-colors';
      chatItem.innerHTML = `
        <div class="text-sm font-medium text-gray-800 truncate">${title}</div>
        <div class="text-xs text-gray-500">Just now</div>
      `;
      chatItem.onclick = () => switchToChat(id, title);
      chatList.insertBefore(chatItem, chatList.firstChild);
    }

    function switchToChat(id, title) {
      currentConversationId = id;
      currentChatTitle.textContent = title;
      // Load chat messages for this conversation
      loadChatMessages(id);
    }

    async function loadChatMessages(conversationId) {
      chatMessages.innerHTML = '<div class="text-center py-12"><p class="text-gray-500">Loading conversation...</p></div>';

      try {
        const response = await fetch(`/fetch-chats?conversation_id=${conversationId}`);
        const data = await response.json();

        chatMessages.innerHTML = '';

        if (data.chats.length === 0) {
          chatMessages.innerHTML = '<div class="text-center py-12"><p class="text-gray-500">No messages in this conversation</p></div>';
          return;
        }

        data.chats.forEach(chat => {
          appendMessage(chat.message, 'user');
          appendMessage(chat.response, 'ai');
        });
      } catch (error) {
        console.error('Failed to load chat messages:', error);
        chatMessages.innerHTML = '<div class="text-center py-12"><p class="text-red-500">Failed to load conversation</p></div>';
      }
    }

    // Event listeners
    newChatBtn.addEventListener('click', () => {
      createNewChat();
      loadConversations(); // Refresh the conversation list
    });

    chatForm.addEventListener('submit', function (event) {
      event.preventDefault();
      const message = chatInput.value.trim();
      console.log('Form submitted with message:', message);
      if (message) {
        appendMessage(message, 'user');
        chatInput.value = '';

        const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]').value;
        console.log('CSRF Token:', csrfToken);

        fetch("{% url 'response' %}", {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': csrfToken,
          },
          body: JSON.stringify({
            message: message,
            conversation_id: currentConversationId
          }),
        })
        .then(response => {
          console.log('Response status:', response.status);
          return response.json();
        })
        .then(data => {
          console.log('Response data:', data);
          appendMessage(data.response, 'ai');

          // Update conversation if it's a new one
          if (!currentConversationId && data.conversation_id) {
            currentConversationId = data.conversation_id;
            currentChatTitle.textContent = message.substring(0, 30) + '...';
          }

          // Refresh conversation list
          loadConversations();
        })
        .catch(err => {
          console.error('Error:', err);
          appendMessage('Sorry, something went wrong. Try again.', 'ai');
        });
      }
    });

    // Load conversations on page load
    async function loadConversations() {
      try {
        console.log('Loading conversations...');
        const response = await fetch('/get-conversations');
        console.log('Conversations response status:', response.status);
        const data = await response.json();
        console.log('Conversations data:', data);

        chatList.innerHTML = '';
        data.conversations.forEach(conv => {
          const chatItem = document.createElement('div');
          chatItem.className = 'p-3 rounded-lg hover:bg-gray-100 cursor-pointer transition-colors';
          chatItem.innerHTML = `
            <div class="text-sm font-medium text-gray-800 truncate">${conv.title}</div>
            <div class="text-xs text-gray-500">${new Date(conv.updated_at).toLocaleDateString()}</div>
          `;
          chatItem.onclick = () => switchToChat(conv.id, conv.title);
          chatList.appendChild(chatItem);
        });
      } catch (error) {
        console.error('Failed to load conversations:', error);
      }
    }

    // Initialize
    window.addEventListener('DOMContentLoaded', () => {
      createNewChat();
      loadConversations();
    });
  </script>

  
</body>
</html>
