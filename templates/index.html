<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GCTU Smart Chat</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .fade-in {
      animation: fadeInUp 0.4s ease-in-out both;
    }
  </style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-blue-100 h-screen flex flex-col font-sans">

  <!-- Header -->
  <header class="bg-blue-700 text-white text-center py-4 shadow">
    <h1 class="text-2xl font-bold">GCTU Smart Chatbot</h1>
    <p class="text-sm mt-1">Ask your questions about GCTU and get instant answers</p>
  </header>

  <!-- Chat Container -->
  <!-- Main Section -->
<main class="flex flex-col max-w-4xl mx-auto w-full flex-grow overflow-hidden">

  <!-- Chat Container with Scroll -->
  <div id="chat-history" class="flex-1 overflow-y-auto space-y-4 p-4 bg-white rounded-lg shadow-md h-0 min-h-0">
    {% comment %}
    {% for chat in chats reversed %}
      <div class="flex justify-end fade-in">
        <div class="max-w-md px-4 py-2 rounded-lg text-sm shadow bg-blue-600 text-white rounded-br-none">
          {{ chat.message }}
        </div>
      </div>
      <div class="flex justify-start fade-in">
        <div class="max-w-md px-4 py-2 rounded-lg text-sm shadow bg-blue-100 text-blue-800 rounded-bl-none">
          {{ chat.response }}
        </div>
      </div>
    {% endfor %}
    {% endcomment %}
  </div>

  <!-- Input Area -->
  <form id="chat-form" method="POST" class="flex mt-4" autocomplete="off">
    {% csrf_token %}
    <input
      id="chat-input"
      name="message"
      type="text"
      placeholder="Type your question..."
      class="flex-grow px-4 py-2 rounded-l-lg border border-blue-300 focus:outline-none focus:ring-2 focus:ring-blue-500"
      required
    />
    <button
      type="submit"
      class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-r-lg transition-all"
    >
      Send
    </button>
  </form>
</main>


  <!-- Footer -->
  <footer class="text-center text-sm text-gray-500 py-4">
    &copy; {{ now|date:"Y" }} Ghana Communication Technology University. All rights reserved.
  </footer>

  <script>
    const chatForm = document.getElementById('chat-form');
    const chatInput = document.getElementById('chat-input');
    const chatHistory = document.getElementById('chat-history');

    function appendMessage(content, sender = 'user') {
      const wrapper = document.createElement('div');
      wrapper.className = `flex ${sender === 'user' ? 'justify-end' : 'justify-start'} fade-in`;

      const message = document.createElement('div');
      message.className = `max-w-md px-4 py-2 rounded-lg text-sm shadow ${
        sender === 'user'
          ? 'bg-blue-600 text-white rounded-br-none'
          : 'bg-blue-100 text-blue-800 rounded-bl-none'
      }`;
      message.textContent = content;

      wrapper.appendChild(message);
      chatHistory.appendChild(wrapper);
      chatHistory.scrollTop = chatHistory.scrollHeight;
    }

    chatForm.addEventListener('submit', function (event) {
      event.preventDefault();
      const message = chatInput.value.trim();
      if (message) {
        appendMessage(message, 'user');
        chatInput.value = '';

        fetch("{% url 'response' %}", {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value,
          },
          body: JSON.stringify({
            message: message,
          }),
        })
        .then(response => response.json())
        .then(data => {
          appendMessage(data.response, 'ai');
        })
        .catch(err => {
          appendMessage('Sorry, something went wrong. Try again.', 'ai');
        });
      }
    });
  </script>

  <script>
    //const chatHistory = document.getElementById('chat-history');
    let page = 1;
    let loading = false;
    let hasNext = true;
  
    async function loadChats() {
      if (!hasNext || loading) return;
  
      loading = true;
      try {
        const response = await fetch(`/fetch-chats?page=${page}`);
        const data = await response.json();
  
        const fragment = document.createDocumentFragment();
  
        data.chats.reverse().forEach(chat => {
          const userDiv = document.createElement('div');
          userDiv.className = 'flex justify-end fade-in';
          const userMsg = document.createElement('div');
          userMsg.className = 'max-w-md px-4 py-2 rounded-lg text-sm shadow bg-blue-600 text-white rounded-br-none';
          userMsg.textContent = chat.message;
          userDiv.appendChild(userMsg);
  
          const botDiv = document.createElement('div');
          botDiv.className = 'flex justify-start fade-in';
          const botMsg = document.createElement('div');
          botMsg.className = 'max-w-md px-4 py-2 rounded-lg text-sm shadow bg-blue-100 text-blue-800 rounded-bl-none';
          botMsg.textContent = chat.response;
          botDiv.appendChild(botMsg);
  
          fragment.insertBefore(botDiv, fragment.firstChild);
          fragment.insertBefore(userDiv, fragment.firstChild);
        });
  
        const firstMessage = chatHistory.firstChild;
        chatHistory.insertBefore(fragment, chatHistory.firstChild);
        if (firstMessage) firstMessage.scrollIntoView();
  
        hasNext = data.has_next;
        page += 1;
      } catch (error) {
        console.error("Failed to load chats:", error);
      } finally {
        loading = false;
      }
    }
  
    chatHistory.addEventListener('scroll', () => {
      if (chatHistory.scrollTop === 0) {
        loadChats();
      }
    });
  
    window.addEventListener('DOMContentLoaded', () => {
      loadChats(); // Load initial chats on login
    });
  </script>
  
</body>
</html>
