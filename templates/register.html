<!-- templates/registration/register.html -->
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Register | GCTU Chatbot</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  
  <style>
    .animate-fadeIn {
      animation: fadeIn 1s ease-in-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

<body class="bg-gradient-to-br from-purple-700 via-indigo-800 to-blue-900 min-h-screen text-white font-sans">

  <!-- ✅ Reusable Header -->
  {% include 'header.html' %}

  <!-- ✅ Form Container -->
  <div class="flex flex-col items-center justify-center min-h-[calc(100vh-4rem)] px-4 py-10">
    <div class="bg-white text-gray-900 rounded-xl shadow-2xl p-8 w-full max-w-lg animate-fadeIn">
      <h2 class="text-3xl font-bold text-center mb-6">Create an Account</h2>
      
      <form method="post">
        {% csrf_token %}
        
        {% for field in form %}
          <div class="mb-4">
            <label for="{{ field.id_for_label }}" class="block text-gray-700 mb-1">{{ field.label }}</label>
            {{ field }}
            {% if field.errors %}
              <p class="text-sm text-red-600">{{ field.errors|striptags }}</p>
            {% endif %}
          </div>
        {% endfor %}

        <button type="submit" class="w-full bg-indigo-600 text-white py-2 px-4 rounded-lg font-semibold hover:bg-indigo-700 transition">
          Register
        </button>
      </form>

      <p class="text-sm text-center text-gray-600 mt-6">
        Already have an account? 
        <a href="{% url 'login' %}" class="text-indigo-600 hover:underline">Login here</a>
      </p>
    </div>
  </div>

</body>
</html>
